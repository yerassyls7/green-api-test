<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREEN-API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>GREEN-API</h1>

        <div class="card">
            <h2>Connection</h2>

            <label for="idInstance">idInstance</label>
            <input type="text" id="idInstance" placeholder="Enter idInstance">

            <label for="apiToken">ApiTokenInstance</label>
            <input type="password" id="apiToken" placeholder="Enter ApiTokenInstance">

            <div class="buttons">
                <button onclick="getSettings()">Get Settings</button>
                <button onclick="getStateInstance()">Get State Instance</button>
            </div>
        </div>

        <div class="card">
            <h2>Send Message</h2>

            <label for="messagePhone">Phone number</label>
            <input type="text" id="messagePhone" placeholder="77712345678">

            <label for="messageText">Message</label>
            <textarea id="messageText" placeholder="Enter message"></textarea>

            <button onclick="sendMessage()">Send Message</button>
        </div>

        <div class="card">
            <h2>Send File By URL</h2>

            <label for="filePhone">Phone number</label>
            <input type="text" id="filePhone" placeholder="77712345678">

            <label for="fileUrl">File URL</label>
            <input type="text" id="fileUrl" placeholder="https://example.com/file.jpg">

            <label for="fileName">File name</label>
            <input type="text" id="fileName" placeholder="file.jpg">

            <label for="fileCaption">Caption</label>
            <input type="text" id="fileCaption" placeholder="Optional caption">

            <button onclick="sendFileByUrl()">Send File By URL</button>
        </div>

        <div class="card">
            <h2>Response</h2>
            <textarea id="response" readonly></textarea>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
